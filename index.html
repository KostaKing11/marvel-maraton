<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marvel Maraton</title>
<meta name="description" content="Maraton do Avengers: Doomsday — samo obavezno ili ceo Marvel.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=215">
</head>
<body>

<div id="app">
  <header id="top">
    <div class="brand" data-a="tab" data-tab="danas">
      <span class="logo">MARVEL</span><span class="logo-sub">MARATON</span>
    </div>
    <button id="me-av" class="me-av" data-a="tab" data-tab="ja" type="button" aria-label="Profil i podešavanja"></button>
  </header>

  <main id="panes">
    <section class="pane" id="p-danas" data-tab="danas"></section>
    <section class="pane" id="p-plan" data-tab="plan" hidden></section>
    <section class="pane" id="p-ekipa" data-tab="ekipa" hidden></section>
    <section class="pane" id="p-katalog" data-tab="katalog" hidden></section>
    <section class="pane" id="p-ja" data-tab="ja" hidden></section>
  </main>

  <nav id="tabs">
    <button class="tab on" data-a="tab" data-tab="danas" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l9.5 8.2-1.3 1.5L19 11.2V21h-5.5v-6h-3v6H5v-9.8l-1.2 1-1.3-1.5z"/></svg>
      <span>Danas</span>
    </button>
    <button class="tab" data-a="tab" data-tab="plan" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h2.5A1.5 1.5 0 0121 5.5v14a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 19.5v-14A1.5 1.5 0 014.5 4H7V2zm-2 8v9h14v-9H5zm2 2h3v3H7v-3z"/></svg>
      <span>Plan</span>
    </button>
    <button class="tab" data-a="tab" data-tab="ekipa" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm-8 0a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm0 2c-2.7 0-8 1.3-8 4v3h9.5v-2.5c0-1.2.6-2.4 1.7-3.3A14 14 0 008 13zm8 0c-.9 0-2 .1-3.1.4 1.3.9 2.1 2.1 2.1 3.6V20H24v-3c0-2.7-5.3-4-8-4z"/></svg>
      <span>Ekipa</span>
    </button>
    <button class="tab" data-a="tab" data-tab="katalog" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
      <span>Katalog</span>
    </button>
  </nav>
</div>

<div id="sheets"></div>
<div id="toasts"></div>
<div id="boot" class="boot"><span class="logo">MARVEL</span><span class="logo-sub">MARATON</span></div>

<script src="js/firebase-config.js?v=215"></script>

<script src="js/doom.js?v=215"></script>
<script src="js/badges.js?v=215"></script>
<script src="js/views.js?v=215"></script>
<script src="js/main.js?v=215"></script>
</body>
</html>
