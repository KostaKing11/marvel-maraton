<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Marvel Maraton</title>
<meta name="description" content="Praćenje gledanja celog MCU-a do Avengers: Doomsday.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="mlogo">MARVEL</span>
    <span class="brand-sub">MARATON</span>
  </div>
  <button id="syncPill" class="sync-pill" data-act="go-sync" type="button">
    <span class="dot"></span><span class="sync-label">lokalno</span>
  </button>
</header>

<main id="view" aria-live="polite"></main>

<nav id="tabbar">
  <button class="tab is-active" data-tab="danas" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v10h-5v-6h-2v6H6V11H3z"/></svg>
    <span>Danas</span>
  </button>
  <button class="tab" data-tab="ocene" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm-8 0a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm0 2c-2.7 0-8 1.3-8 4v3h9.5v-2.5c0-1.2.6-2.4 1.7-3.3A14 14 0 008 13zm8 0c-.9 0-2 .1-3.1.4 1.3.9 2.1 2.1 2.1 3.6V20H24v-3c0-2.7-5.3-4-8-4z"/></svg>
    <span>Ekipa</span>
  </button>
  <button class="tab" data-tab="biblioteka" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
    <span>Biblioteka</span>
  </button>
  <button class="tab" data-tab="ja" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 5.5V21h18v-1.5c0-3-4-5.5-9-5.5z"/></svg>
    <span>Ja</span>
  </button>
</nav>

<!-- Modal (detalji naslova / dijalozi) -->
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true"></div>

<!-- Onboarding / sync kod -->
<div id="onboarding" class="overlay hidden"></div>

<!-- Toast poruke -->
<div id="toast" class="toast hidden"></div>

<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script src="planner.js"></script>
<script src="posters.js"></script>
<script src="reviews.js"></script>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
