# Kad se na main promeni firestore.rules, pravila se sama objave u Firebase.
# Treba jednom: GitHub tajna FIREBASE_SERVICE_ACCOUNT = JSON kljuc servisnog naloga
# (uputstvo: docs/firestore-pravila.md). Bez tajne korak se samo preskoci.
name: Firestore pravila

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Objavi pravila
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Nema tajne FIREBASE_SERVICE_ACCOUNT - preskacem."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules --project marvel-marathon-kosat --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
